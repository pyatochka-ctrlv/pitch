<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пульт Пітч-дня</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Rubik:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/avatars.css">
  <link rel="stylesheet" href="css/pult.css">
</head>
<body>
  <!-- ШАПКА: вкладки, поточна дитина, стан сцени -->
  <header class="top">
    <div class="brand" title="Цю вкладку не демонструємо">🎛️ Пульт</div>
    <nav class="tabs" role="tablist">
      <button class="tab" data-tab="prep" type="button" role="tab">🛠️ Підготовка</button>
      <button class="tab" data-tab="pitch" type="button" role="tab">🎤 Пітч</button>
    </nav>
    <div class="now">На сцені: <b id="now-name">—</b></div>
    <a id="status" class="status off" href="stage.html" target="_blank" rel="noopener">🔴 Сцену не відкрито</a>
  </header>

  <!-- ================= ПІДГОТОВКА ================= -->
  <main id="tab-prep" class="tab-page prep">
    <section class="card kids">
      <h2>👧 Діти й аватари</h2>
      <form id="add-form" class="add-row" autocomplete="off">
        <input id="new-name" type="text" placeholder="Ім'я дитини (видно лише на пульті)" maxlength="40">
        <button class="btn-inline" type="submit">➕ Додати</button>
      </form>
      <div id="kid-list" class="kid-list"></div>
    </section>

    <div class="side">
      <section class="card">
        <h2>🖥️ Що показує сцена</h2>
        <div class="btn-row three" id="modes">
          <button class="btn" data-mode="gallery" type="button"><span class="e">🖼️</span>Галерея аватарів</button>
          <button class="btn" data-mode="stage" type="button"><span class="e">🎭</span>Сцена</button>
          <button class="btn" data-mode="final" type="button"><span class="e">🎉</span>Фінал</button>
        </div>
        <div class="toggles">
          <label class="toggle"><input id="show-name" type="checkbox"><span></span> Показувати ім'я на сцені</label>
          <label class="toggle"><input id="show-cheat" type="checkbox"><span></span> Шпаргалка технік на сцені</label>
        </div>
      </section>

      <section class="card">
        <h2>🔊 Звук сцени</h2>
        <label class="vol">Гучність <input id="volume" type="range" min="0" max="100" step="5"> <b id="vol-val">70%</b></label>
        <div class="btn-row three">
          <button id="mute" class="btn" type="button"><span class="e">🔇</span>Тиша</button>
          <button id="test-sound" class="btn" type="button"><span class="e">🔔</span>Перевірити звук</button>
          <a class="btn" href="stage.html" target="_blank" rel="noopener"><span class="e">🎭</span>Відкрити сцену</a>
        </div>
      </section>

      <section class="card">
        <h2>📋 Підсумок уроку</h2>
        <div class="btn-row three">
          <button id="copy-text" class="btn" type="button"><span class="e">📋</span>Скопіювати текст</button>
          <button id="copy-csv" class="btn" type="button"><span class="e">📊</span>Скопіювати CSV</button>
          <button id="dl-csv" class="btn" type="button"><span class="e">⬇️</span>Завантажити CSV</button>
        </div>
        <div id="reset-zone-top" class="reset-zone" data-zone="top"></div>
      </section>
    </div>

    <section class="card danger-zone">
      <div id="reset-zone" class="reset-zone" data-zone="bottom"></div>
    </section>
  </main>

  <!-- ================= ПІТЧ (один екран без прокрутки) ================= -->
  <main id="tab-pitch" class="tab-page pitch">
    <!-- колонка 1: дитина + таймер -->
    <div class="col">
      <section class="card now-card">
        <div id="p-avatar" class="p-avatar"></div>
        <div id="p-name" class="p-name">—</div>
        <div id="p-invention" class="p-invention"></div>
      </section>
      <section class="card timer-card">
        <div class="timer-head">
          <div id="t-display" class="t-display">1:00</div>
          <button id="p-mute" class="mute-mini" type="button" title="Тиша на сцені">🔇</button>
        </div>
        <div id="t-state" class="t-state">готово до старту</div>
        <div class="t-bar"><div id="t-fill"></div></div>
        <div class="btn-row three" id="durations"></div>
        <div class="btn-row three">
          <button id="t-start" class="btn green" type="button"><span class="e">▶️</span>Старт</button>
          <button id="t-pause" class="btn yellow" type="button"><span class="e">⏸️</span>Пауза</button>
          <button id="t-reset" class="btn" type="button"><span class="e">🔄</span>Скинути</button>
        </div>
      </section>
    </div>

    <!-- колонка 2: журі й реакції -->
    <div class="col">
      <section class="card jury-card">
        <button class="btn huge violet" data-fx="question" type="button"><span class="e">🙋</span>Питання журі<small>випадкове</small></button>
        <details class="questions">
          <summary>Обрати питання зі списку</summary>
          <div id="q-list" class="q-list"></div>
        </details>
      </section>
      <section class="card react-card">
        <div class="btn-row two">
          <button class="btn big pink" data-fx="applause" type="button"><span class="e">👏</span>Оплески</button>
          <button class="btn big pink" data-fx="star" type="button"><span class="e">🌟</span>Незбивний момент</button>
        </div>
        <button id="p-stamp" class="btn wide stamp-btn" type="button" style="--ink:#c2185b"><span class="e">💡</span><span id="p-stamp-label">Печатка «Винахідник»</span></button>
      </section>
    </div>

    <!-- колонка 3: чекліст + наступний -->
    <div class="col">
      <section class="card check-card">
        <h3>Чекліст: <b id="check-for">—</b> <small>(на сцені не видно)</small></h3>
        <div id="checklist" class="checklist"></div>
        <label class="dur-row">⏱ Тривалість: <input id="duration" type="number" min="0" max="600" placeholder="—"> с <span id="dur-hint" class="dur-hint"></span></label>
        <textarea id="note" placeholder="Нотатка про виступ (лише для вас)"></textarea>
      </section>
      <button id="next" class="btn next-btn" type="button">Наступний ▶</button>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <dialog id="copy-dialog">
    <p>Не вдалося скопіювати автоматично. Виділіть текст (Ctrl+A) і скопіюйте (Ctrl+C):</p>
    <textarea id="copy-area" rows="14"></textarea>
    <form method="dialog"><button class="btn-inline" type="submit">Готово</button></form>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/avatars.js"></script>
  <script src="js/pult.js"></script>
</body>
</html>
